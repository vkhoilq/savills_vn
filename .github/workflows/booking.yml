name: Booking Schedule

on:
  workflow_dispatch:
    inputs:
      hour:
        description: "Hour to book"
        required: true
        default: "7"
      dayinweek:
        description: "Day in week for account 1 (Mon=0, Sat=5). Account 2 gets +1 day."
        required: true
        default: "5"
      month:
        description: "Month"
        required: true
        default: "11"
      year:
        description: "Year"
        required: true
        default: "2027"
      wait:
        description: "Wait until 00:00 (1=yes, 0=no)"
        required: true
        default: "1"

jobs:
  book_account1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run booking (account 1 - day ${{ inputs.dayinweek }})
        env:
          USERNAME: ${{ secrets.SAVILLS_USERNAME_1 }}
          PASSWORD: ${{ secrets.SAVILLS_PASSWORD_1 }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          uv run booking_schedule_cli.py \
            "${{ inputs.hour }}" \
            "${{ inputs.dayinweek }}" \
            "${{ inputs.month }}" \
            "${{ inputs.year }}" \
            "${{ inputs.wait }}"

  book_account2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run booking (account 2 - day $(( ${{ inputs.dayinweek }} + 1 )))
        env:
          USERNAME: ${{ secrets.SAVILLS_USERNAME_2 }}
          PASSWORD: ${{ secrets.SAVILLS_PASSWORD_2 }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          dayinweek=$(( ${{ inputs.dayinweek }} + 1 ))
          uv run booking_schedule_cli.py \
            "${{ inputs.hour }}" \
            "$dayinweek" \
            "${{ inputs.month }}" \
            "${{ inputs.year }}" \
            "${{ inputs.wait }}"
