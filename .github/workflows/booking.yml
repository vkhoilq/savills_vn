name: Booking Schedule

on:
  workflow_dispatch:
    inputs:
      hour:
        description: "Hour to book"
        required: true
        default: "7"
      dayinweek:
        description: "Day in week for account 1 (Mon=0, Sat=5). Account 2 gets +1 day."
        required: true
        default: "5"
      month:
        description: "Month"
        required: true
        default: "11"
      year:
        description: "Year"
        required: true
        default: "2027"
      wait:
        description: "Wait until 00:00 (1=yes, 0=no)"
        required: true
        default: "1"

jobs:
  book:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - username: ${{ secrets.SAVILLS_USERNAME_1 }}
            password: ${{ secrets.SAVILLS_PASSWORD_1 }}
            day_offset: 0
          - username: ${{ secrets.SAVILLS_USERNAME_2 }}
            password: ${{ secrets.SAVILLS_PASSWORD_2 }}
            day_offset: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run booking
        env:
          USERNAME: ${{ matrix.username }}
          PASSWORD: ${{ matrix.password }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          dayinweek=$(( ${{ inputs.dayinweek }} + ${{ matrix.day_offset }} ))
          uv run booking_schedule_cli.py \
            "${{ inputs.hour }}" \
            "$dayinweek" \
            "${{ inputs.month }}" \
            "${{ inputs.year }}" \
            "${{ inputs.wait }}"
